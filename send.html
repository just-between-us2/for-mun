<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>届ける 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0f5, transparent 45%),
        linear-gradient(160deg, #fffafa, #ffeef4);
      color: #333;
    }

    .card {
      width: 100%;
      max-width: 430px;
      margin: 20px auto;
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      padding: 34px 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(180,100,130,0.15);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 26px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid #f0dce4;
      border-radius: 20px;
      padding: 16px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.7;
      font-family: inherit;
      background: #fffafa;
      outline: none;
    }

    textarea:focus {
      border-color: #e8b9c9;
    }

    .photo-area {
      margin-top: 22px;
    }

    .file-label {
      display: inline-block;
      padding: 13px 20px;
      background: #fff0f5;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
    }

    #photoInput {
      display: none;
    }

    #previewTitle {
      display: none;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #aaa;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 10px;
    }

    #sendButton {
      width: 100%;
      margin-top: 24px;
      border: none;
      padding: 15px;
      border-radius: 999px;
      background: #eab6c8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 14px;
      min-height: 20px;
      color: #999;
      font-size: 14px;
    }

    .section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #f1e4e9;
    }

    .section-title {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
    }

    #currentPost {
      display: none;
    }

    #currentMessage {
      font-size: 17px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #currentPhoto {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 16px;
    }

    #currentDate {
      margin-top: 14px;
      font-size: 12px;
      color: #aaa;
    }

    .history-item {
      padding: 18px 0;
      border-bottom: 1px solid #f3e7eb;
      text-align: left;
    }

    .history-message {
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .history-photo {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-top: 12px;
    }

    .history-date {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
    }

    .delete-button {
      margin-top: 12px;
      padding: 8px 14px;
      border: none;
      border-radius: 999px;
      background: #fff0f3;
      color: #c77c92;
      font-size: 12px;
      cursor: pointer;
    }

    .delete-button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>届ける 💌</h1>

  <textarea
    id="messageInput"
    placeholder="メッセージを書く…"
  ></textarea>

  <div class="photo-area">

    <label class="file-label" for="photoInput">
      📷 写真を選ぶ
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

    <div id="previewTitle">
      今回届ける写真
    </div>

    <img id="preview" alt="preview">

  </div>

  <button id="sendButton">
    届ける 💌
  </button>

  <div id="status"></div>


  <!-- 今届けているもの -->

  <div id="currentPost" class="section">

    <div class="section-title">
      今届けているもの
    </div>

    <div id="currentMessage"></div>

    <img id="currentPhoto" alt="current photo">

    <div id="currentDate"></div>

  </div>


  <!-- 履歴 -->

  <div id="historySection" class="section">

    <div class="section-title">
      これまで届けたもの
    </div>

    <div id="historyList">
      読み込んでいます…
    </div>

  </div>

</div>


<script>

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";

const REST_URL =
  PROJECT_URL + "/rest/v1";

const STORAGE_URL =
  PROJECT_URL + "/storage/v1";

const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";

const BUCKET = "photos";


const messageInput =
  document.getElementById("messageInput");

const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const previewTitle =
  document.getElementById("previewTitle");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");


/* -------------------------
   写真プレビュー
-------------------------- */

photoInput.addEventListener("change", function () {

  const file =
    photoInput.files[0];

  if (!file) {

    preview.style.display =
      "none";

    previewTitle.style.display =
      "none";

    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

  previewTitle.style.display =
    "block";

});


/* -------------------------
   今届けているもの
-------------------------- */

async function loadCurrentPost() {

  try {

    const response = await fetch(
      REST_URL +
      "/messages?select=id,message,photo_url,created_at&order=id.desc&limit=1",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        "最新投稿を取得できませんでした"
      );
    }

    const data =
      await response.json();

    const currentPost =
      document.getElementById("currentPost");

    const currentMessage =
      document.getElementById("currentMessage");

    const currentPhoto =
      document.getElementById("currentPhoto");

    const currentDate =
      document.getElementById("currentDate");


    if (data.length === 0) {

      currentPost.style.display =
        "none";

      return;
    }


    const post =
      data[0];

    currentPost.style.display =
      "block";


    currentMessage.textContent =
      post.message || "";


    if (post.photo_url) {

      currentPhoto.src =
        post.photo_url;

      currentPhoto.style.display =
        "block";

    } else {

      currentPhoto.removeAttribute("src");

      currentPhoto.style.display =
        "none";

    }


    const date =
      new Date(post.created_at);

    currentDate.textContent =
      date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

  } catch (error) {

    console.error(error);

  }

}


/* -------------------------
   履歴
-------------------------- */

async function loadHistory() {

  try {

    const response = await fetch(
      REST_URL +
      "/messages?select=id,message,photo_url,created_at&order=id.desc&limit=50",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        "履歴を取得できませんでした"
      );
    }


    const posts =
      await response.json();

    const historyList =
      document.getElementById("historyList");

    historyList.innerHTML =
      "";


    if (posts.length === 0) {

      historyList.textContent =
        "まだ履歴はありません";

      return;
    }


    posts.forEach(function(post) {

      const item =
        document.createElement("div");

      item.className =
        "history-item";


      if (post.message) {

        const message =
          document.createElement("div");

        message.className =
          "history-message";

        message.textContent =
          post.message;

        item.appendChild(message);

      }


      if (post.photo_url) {

        const img =
          document.createElement("img");

        img.className =
          "history-photo";

        img.src =
          post.photo_url;

        item.appendChild(img);

      }


      const date =
        new Date(post.created_at);

      const dateText =
        document.createElement("div");

      dateText.className =
        "history-date";

      dateText.textContent =
        date.toLocaleString("ja-JP", {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });

      item.appendChild(dateText);


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "削除";

      deleteButton.addEventListener(
        "click",
        async function() {

          const ok =
            confirm(
              "この投稿を削除する？"
            );

          if (!ok) {
            return;
          }

          deleteButton.disabled =
            true;

          deleteButton.textContent =
            "削除中…";

          await deletePost(post);

        }
      );


      item.appendChild(
        deleteButton
      );

      historyList.appendChild(
        item
      );

    });

  } catch (error) {

    console.error(error);

    document.getElementById(
      "historyList"
    ).textContent =
      "履歴を読み込めませんでした 🥲";

  }

}


/* -------------------------
   投稿削除
-------------------------- */

async function deletePost(post) {

  try {

    /*
      写真付きならStorageからも削除
    */

    if (post.photo_url) {

      const marker =
        "/storage/v1/object/public/photos/";

      const position =
        post.photo_url.indexOf(marker);


      if (position !== -1) {

        const fileName =
          decodeURIComponent(
            post.photo_url.substring(
              position +
              marker.length
            )
          );


        const photoDeleteResponse =
          await fetch(
            STORAGE_URL +
            "/object/" +
            BUCKET +
            "/" +
            encodeURIComponent(fileName),
            {
              method: "DELETE",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY
              }
            }
          );


        if (!photoDeleteResponse.ok) {

          const errorText =
            await photoDeleteResponse.text();

          throw new Error(
            "写真削除失敗: " +
            errorText
          );

        }

      }

    }


    /*
      messagesから削除
    */

    const messageDeleteResponse =
      await fetch(
        REST_URL +
        "/messages?id=eq." +
        post.id,
        {
          method: "DELETE",

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    if (!messageDeleteResponse.ok) {

      const errorText =
        await messageDeleteResponse.text();

      throw new Error(
        "投稿削除失敗: " +
        errorText
      );

    }


    await loadCurrentPost();

    await loadHistory();


  } catch (error) {

    console.error(error);

    alert(
      "削除に失敗しました 🥲"
    );

    await loadHistory();

  }

}


/* -------------------------
   届ける
-------------------------- */

sendButton.addEventListener(
  "click",
  async function() {

    const message =
      messageInput.value.trim();

    const file =
      photoInput.files[0];


    if (!message && !file) {

      status.textContent =
        "メッセージか写真を選んでね 💭";

      return;

    }


    sendButton.disabled =
      true;

    status.textContent =
      "届けています… 💌";


    let photoUrl =
      null;

    let uploadedFileName =
      null;


    try {

      /*
        写真があれば先にアップロード
      */

      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
            : "jpg";


        uploadedFileName =
          Date.now() +
          "." +
          extension;


        const photoResponse =
          await fetch(
            STORAGE_URL +
            "/object/" +
            BUCKET +
            "/" +
            uploadedFileName,
            {
              method: "POST",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Content-Type":
                  file.type ||
                  "image/jpeg",

                "x-upsert":
                  "false"
              },

              body: file
            }
          );


        if (!photoResponse.ok) {

          const errorText =
            await photoResponse.text();

          throw new Error(
            "写真送信失敗: " +
            errorText
          );

        }


        photoUrl =
          STORAGE_URL +
          "/object/public/" +
          BUCKET +
          "/" +
          encodeURIComponent(
            uploadedFileName
          );

      }


      /*
        メッセージと写真URLを
        1セットで保存
      */

      const messageResponse =
        await fetch(
          REST_URL +
          "/messages",
          {
            method: "POST",

            headers: {
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify({
                message:
                  message || "",

                photo_url:
                  photoUrl
              })
          }
        );


      if (!messageResponse.ok) {

        const errorText =
          await messageResponse.text();

        throw new Error(
          "メッセージ送信失敗: " +
          errorText
        );

      }


      status.textContent =
        "届きました 💌♡";


      messageInput.value =
        "";

      photoInput.value =
        "";

      preview.style.display =
        "none";

      preview.removeAttribute(
        "src"
      );

      previewTitle.style.display =
        "none";


      await loadCurrentPost();

      await loadHistory();


    } catch (error) {

      console.error(error);

      status.textContent =
        "エラー：" +
        error.message;

    } finally {

      sendButton.disabled =
        false;

    }

  }
);


/* -------------------------
   ページを開いた時
-------------------------- */

loadCurrentPost();
loadHistory();

</script>

</body>
</html>
