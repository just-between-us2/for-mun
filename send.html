<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>届ける 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;

      background:
        radial-gradient(circle at top left, #fff0f5, transparent 45%),
        linear-gradient(160deg, #fffafa, #ffeef4);

      color: #333;
    }

    .card {
      width: 100%;
      max-width: 430px;
      margin: 20px auto;

      background: rgba(255,255,255,0.94);

      border-radius: 28px;

      padding: 34px 24px;

      text-align: center;

      box-shadow:
        0 15px 45px
        rgba(180,100,130,0.15);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 26px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 140px;

      border: 1px solid #f0dce4;

      border-radius: 20px;

      padding: 16px;

      resize: vertical;

      font-size: 16px;
      line-height: 1.7;

      font-family: inherit;

      background: #fffafa;

      outline: none;
    }

    textarea:focus {
      border-color: #e8b9c9;
    }

    .photo-area {
      margin-top: 22px;
    }

    .file-label {
      display: inline-block;

      padding: 13px 20px;

      background: #fff0f5;

      border-radius: 999px;

      cursor: pointer;

      font-size: 15px;
    }

    #photoInput {
      display: none;
    }

    #previewTitle {
      display: none;

      margin-top: 20px;
      margin-bottom: 8px;

      font-size: 13px;
      color: #aaa;
    }

    #preview {
      display: none;

      width: 100%;
      max-height: 360px;

      object-fit: cover;

      border-radius: 20px;

      margin-top: 10px;
    }

    #sendButton {
      width: 100%;

      margin-top: 24px;

      border: none;

      padding: 15px;

      border-radius: 999px;

      background: #eab6c8;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 14px;

      min-height: 20px;

      color: #999;

      font-size: 14px;
    }

    .section {
      margin-top: 32px;

      padding-top: 24px;

      border-top: 1px solid #f1e4e9;
    }

    .section-title {
      font-size: 13px;

      color: #aaa;

      margin-bottom: 14px;
    }

    /* ----------------
       今届けているもの
    ---------------- */

    #currentPost {
      display: none;
    }

    #currentMessage {
      font-size: 17px;

      line-height: 1.7;

      white-space: pre-wrap;

      word-break: break-word;
    }

    #currentPhoto {
      display: none;

      width: 100%;

      max-height: 360px;

      object-fit: cover;

      border-radius: 20px;

      margin-top: 16px;
    }

    #currentDate {
      margin-top: 14px;

      font-size: 12px;

      color: #aaa;
    }

    /* ----------------
       既読
    ---------------- */

    #viewStatus {
      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 16px;

      background: #fff7fa;

      font-size: 13px;

      line-height: 1.6;
    }

    #viewedText {
      color: #777;
    }

    /* ----------------
       リアクション
    ---------------- */

    #reactionDisplay {
      margin-top: 12px;

      font-size: 14px;

      min-height: 24px;
    }

    .reaction-big {
      font-size: 25px;

      margin-left: 5px;
    }

    /* ----------------
       履歴
    ---------------- */

    .history-item {
      padding: 18px 0;

      border-bottom: 1px solid #f3e7eb;

      text-align: left;
    }

    .history-message {
      font-size: 15px;

      line-height: 1.7;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .history-photo {
      width: 100%;

      max-height: 300px;

      object-fit: cover;

      border-radius: 16px;

      margin-top: 12px;
    }

    .history-date {
      margin-top: 10px;

      font-size: 11px;

      color: #aaa;
    }

    .history-viewed {
      margin-top: 7px;

      font-size: 11px;

      color: #999;
    }

    .history-reaction {
      margin-top: 7px;

      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>
    届ける 💌
  </h1>


  <textarea
    id="messageInput"
    placeholder="メッセージを書く…"
  ></textarea>


  <div class="photo-area">

    <label
      class="file-label"
      for="photoInput"
    >
      📷 写真を選ぶ
    </label>


    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >


    <div id="previewTitle">
      今回届ける写真
    </div>


    <img
      id="preview"
      alt="preview"
    >

  </div>


  <button id="sendButton">
    届ける 💌
  </button>


  <div id="status"></div>


  <!-- 今届けているもの -->

  <div
    id="currentPost"
    class="section"
  >

    <div class="section-title">
      今届けているもの
    </div>


    <div id="currentMessage"></div>


    <img
      id="currentPhoto"
      alt="current photo"
    >


    <div id="currentDate"></div>


    <!-- 既読 -->

    <div id="viewStatus">

      <div id="viewedText">
        まだ見ていません
      </div>

      <div id="reactionDisplay"></div>

    </div>

  </div>


  <!-- 履歴 -->

  <div
    id="historySection"
    class="section"
  >

    <div class="section-title">
      これまで届けたもの
    </div>


    <div id="historyList">
      読み込んでいます…
    </div>

  </div>

</div>


<script>

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";


const REST_URL =
  PROJECT_URL +
  "/rest/v1";


const STORAGE_URL =
  PROJECT_URL +
  "/storage/v1";


const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";


const BUCKET =
  "photos";


const messageInput =
  document.getElementById(
    "messageInput"
  );


const photoInput =
  document.getElementById(
    "photoInput"
  );


const preview =
  document.getElementById(
    "preview"
  );


const previewTitle =
  document.getElementById(
    "previewTitle"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const status =
  document.getElementById(
    "status"
  );


/* -------------------------
   写真プレビュー
-------------------------- */

photoInput.addEventListener(
  "change",
  function() {

    const file =
      photoInput.files[0];


    if (!file) {

      preview.style.display =
        "none";

      previewTitle.style.display =
        "none";

      return;
    }


    preview.src =
      URL.createObjectURL(file);


    preview.style.display =
      "block";


    previewTitle.style.display =
      "block";

  }
);


/* -------------------------
   今届けているもの
-------------------------- */

async function loadCurrentPost() {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?select=id,message,photo_url,created_at,viewed_at,reaction" +

        "&order=id.desc" +

        "&limit=1",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }

        }

      );


    if (!response.ok) {

      throw new Error(
        "最新投稿を取得できませんでした"
      );

    }


    const data =
      await response.json();


    const currentPost =
      document.getElementById(
        "currentPost"
      );


    const currentMessage =
      document.getElementById(
        "currentMessage"
      );


    const currentPhoto =
      document.getElementById(
        "currentPhoto"
      );


    const currentDate =
      document.getElementById(
        "currentDate"
      );


    const viewedText =
      document.getElementById(
        "viewedText"
      );


    const reactionDisplay =
      document.getElementById(
        "reactionDisplay"
      );


    if (data.length === 0) {

      currentPost.style.display =
        "none";

      return;

    }


    const post =
      data[0];


    currentPost.style.display =
      "block";


    /* メッセージ */

    currentMessage.textContent =
      post.message ||
      "";


    /* 写真 */

    if (post.photo_url) {

      currentPhoto.src =
        post.photo_url;


      currentPhoto.style.display =
        "block";

    } else {

      currentPhoto
        .removeAttribute(
          "src"
        );


      currentPhoto.style.display =
        "none";

    }


    /* 送信時間 */

    const sentDate =
      new Date(
        post.created_at
      );


    currentDate.textContent =
      "送信：" +
      sentDate.toLocaleString(
        "ja-JP",
        {
          year:
            "numeric",

          month:
            "long",

          day:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      );


    /* ----------------
       既読
    ---------------- */

    if (post.viewed_at) {

      const viewedDate =
        new Date(
          post.viewed_at
        );


      viewedText.textContent =
        "見てくれた ✓ " +
        viewedDate.toLocaleString(
          "ja-JP",
          {
            month:
              "long",

            day:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );

    } else {

      viewedText.textContent =
        "まだ見ていません";

    }


    /* ----------------
       リアクション
    ---------------- */

    if (post.reaction) {

      reactionDisplay.innerHTML =
        "リアクション：" +
        '<span class="reaction-big">' +
        escapeHtml(post.reaction) +
        "</span>";

    } else {

      reactionDisplay.textContent =
        "リアクションはまだありません";

    }


  } catch (error) {

    console.error(
      error
    );

  }

}


/* -------------------------
   履歴
-------------------------- */

async function loadHistory() {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?select=id,message,photo_url,created_at,viewed_at,reaction" +

        "&order=id.desc" +

        "&limit=50",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }

        }

      );


    if (!response.ok) {

      throw new Error(
        "履歴を取得できませんでした"
      );

    }


    const posts =
      await response.json();


    const historyList =
      document.getElementById(
        "historyList"
      );


    historyList.innerHTML =
      "";


    if (posts.length === 0) {

      historyList.textContent =
        "まだ履歴はありません";

      return;

    }


    posts.forEach(
      function(post) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "history-item";


        /* メッセージ */

        if (post.message) {

          const message =
            document.createElement(
              "div"
            );


          message.className =
            "history-message";


          message.textContent =
            post.message;


          item.appendChild(
            message
          );

        }


        /* 写真 */

        if (post.photo_url) {

          const img =
            document.createElement(
              "img"
            );


          img.className =
            "history-photo";


          img.src =
            post.photo_url;


          item.appendChild(
            img
          );

        }


        /* 送信時間 */

        const date =
          new Date(
            post.created_at
          );


        const dateText =
          document.createElement(
            "div"
          );


        dateText.className =
          "history-date";


        dateText.textContent =
          "送信：" +
          date.toLocaleString(
            "ja-JP",
            {
              year:
                "numeric",

              month:
                "long",

              day:
                "numeric",

              hour:
                "2-digit",

              minute:
                "2-digit"
            }
          );


        item.appendChild(
          dateText
        );


        /* 既読 */

        const viewed =
          document.createElement(
            "div"
          );


        viewed.className =
          "history-viewed";


        if (post.viewed_at) {

          const viewedDate =
            new Date(
              post.viewed_at
            );


          viewed.textContent =
            "見てくれた ✓ " +
            viewedDate.toLocaleString(
              "ja-JP",
              {
                month:
                  "long",

                day:
                  "numeric",

                hour:
                  "2-digit",

                minute:
                  "2-digit"
              }
            );

        } else {

          viewed.textContent =
            "まだ見ていません";

        }


        item.appendChild(
          viewed
        );


        /* リアクション */

        const reaction =
          document.createElement(
            "div"
          );


        reaction.className =
          "history-reaction";


        if (post.reaction) {

          reaction.textContent =
            "リアクション：" +
            post.reaction;

        } else {

          reaction.textContent =
            "リアクションなし";

        }


        item.appendChild(
          reaction
        );


        historyList.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      "historyList"
    ).textContent =
      "履歴を読み込めませんでした 🥲";

  }

}


/* -------------------------
   届ける
-------------------------- */

sendButton.addEventListener(
  "click",
  async function() {

    const message =
      messageInput.value.trim();


    const file =
      photoInput.files[0];


    if (!message && !file) {

      status.textContent =
        "メッセージか写真を選んでね 💭";

      return;

    }


    sendButton.disabled =
      true;


    status.textContent =
      "届けています… 💌";


    let photoUrl =
      null;


    try {


      /* ----------------
         写真アップロード
      ---------------- */

      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
            : "jpg";


        const fileName =
          Date.now() +
          "." +
          extension;


        const photoResponse =
          await fetch(

            STORAGE_URL +

            "/object/" +

            BUCKET +

            "/" +

            fileName,

            {

              method:
                "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Content-Type":
                  file.type ||
                  "image/jpeg",

                "x-upsert":
                  "false"
              },

              body:
                file

            }

          );


        if (!photoResponse.ok) {

          const errorText =
            await photoResponse.text();


          throw new Error(
            "写真送信失敗: " +
            errorText
          );

        }


        photoUrl =
          STORAGE_URL +

          "/object/public/" +

          BUCKET +

          "/" +

          encodeURIComponent(
            fileName
          );

      }


      /* ----------------
         投稿保存
      ---------------- */

      const messageResponse =
        await fetch(

          REST_URL +
          "/messages",

          {

            method:
              "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(
                {

                  message:
                    message ||
                    "",

                  photo_url:
                    photoUrl,

                  viewed_at:
                    null,

                  reaction:
                    null

                }
              )

          }

        );


      if (!messageResponse.ok) {

        const errorText =
          await messageResponse.text();


        throw new Error(
          "メッセージ送信失敗: " +
          errorText
        );

      }


      status.textContent =
        "届きました 💌♡";


      messageInput.value =
        "";


      photoInput.value =
        "";


      preview.style.display =
        "none";


      preview
        .removeAttribute(
          "src"
        );


      previewTitle.style.display =
        "none";


      await loadCurrentPost();

      await loadHistory();


    } catch (error) {

      console.error(
        error
      );


      status.textContent =
        "エラー：" +
        error.message;

    } finally {

      sendButton.disabled =
        false;

    }

  }
);


/* -------------------------
   HTML表示用
-------------------------- */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* -------------------------
   ページを開いた時
-------------------------- */

loadCurrentPost();
loadHistory();

setInterval(function () {
  loadCurrentPost();
}, 5000);


</script>

</body>
</html>
