<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>届ける 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0f5, transparent 45%),
        linear-gradient(160deg, #fffafa, #ffeef4);
      color: #333;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      padding: 34px 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(180,100,130,0.15);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 26px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid #f0dce4;
      border-radius: 20px;
      padding: 16px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.7;
      font-family: inherit;
      background: #fffafa;
      outline: none;
    }

    textarea:focus {
      border-color: #e8b9c9;
    }

    .photo-area {
      margin-top: 22px;
    }

    .file-label {
      display: inline-block;
      padding: 13px 20px;
      background: #fff0f5;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
    }

    #photoInput {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 18px;
    }

    #sendButton {
      width: 100%;
      margin-top: 24px;
      border: none;
      padding: 15px;
      border-radius: 999px;
      background: #eab6c8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 14px;
      min-height: 20px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>届ける 💌</h1>

  <textarea
    id="messageInput"
    placeholder="メッセージを書く…"
  ></textarea>

  <div class="photo-area">

    <label class="file-label" for="photoInput">
      📷 写真を選ぶ
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

    <img id="preview">

  </div>

  <button id="sendButton">
    届ける 💌
  </button>

  <div id="status"></div>

</div>


<script>

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";

const REST_URL =
  PROJECT_URL + "/rest/v1";

const STORAGE_URL =
  PROJECT_URL + "/storage/v1";

const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";

const BUCKET = "photos";


const messageInput =
  document.getElementById("messageInput");

const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");


/* 写真プレビュー */

photoInput.addEventListener("change", function () {

  const file = photoInput.files[0];

  if (!file) {

    preview.style.display = "none";

    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

  document.getElementById("previewTitle").style.display =
  "block";
});


/* 届ける */

sendButton.addEventListener("click", async function () {

  const message =
    messageInput.value.trim();

  const file =
    photoInput.files[0];


  if (!message && !file) {

    status.textContent =
      "メッセージか写真を選んでね 💭";

    return;
  }


  sendButton.disabled = true;

  status.textContent =
    "届けています… 💌";


  try {

    /* -----------------
       メッセージ送信
    ------------------ */

    if (message) {

      const messageResponse =
        await fetch(
          REST_URL + "/messages",
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,

              "Authorization":
                "Bearer " + SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );


      if (!messageResponse.ok) {

        const errorText =
          await messageResponse.text();

        throw new Error(
          "メッセージ送信失敗: " +
          errorText
        );
      }

    }


    /* -----------------
       写真送信
    ------------------ */

    if (file) {

      const extension =
        file.name.includes(".")
          ? file.name.split(".").pop()
          : "jpg";


      const fileName =
        Date.now() +
        "." +
        extension;


      const photoResponse =
        await fetch(
          STORAGE_URL +
          "/object/" +
          BUCKET +
          "/" +
          fileName,
          {
            method: "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                file.type ||
                "image/jpeg",

              "x-upsert":
                "false"
            },

            body: file
          }
        );


      if (!photoResponse.ok) {

        const errorText =
          await photoResponse.text();

        throw new Error(
          "写真送信失敗: " +
          errorText
        );
      }

    }


    status.textContent =
      "届きました 💌♡";


    messageInput.value = "";

    photoInput.value = "";

    preview.style.display =
      "none";

    document.getElementById("previewTitle").style.display =
  "none";

  } catch (error) {

    console.error(error);

    status.textContent =
      "送信に失敗しました 🥲";

  } finally {

    sendButton.disabled = false;

  }

});

</script>

</body>
</html>
