<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>届ける 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0f5, transparent 45%),
        linear-gradient(160deg, #fffafa, #ffeef4);
      color: #333;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      padding: 34px 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(180,100,130,0.15);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 26px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      border: 1px solid #f0dce4;
      border-radius: 20px;
      padding: 16px;
      resize: vertical;
      font-size: 16px;
      line-height: 1.7;
      font-family: inherit;
      background: #fffafa;
      outline: none;
    }

    textarea:focus {
      border-color: #e8b9c9;
    }

    .photo-area {
      margin-top: 22px;
    }

    .file-label {
      display: inline-block;
      padding: 13px 20px;
      background: #fff0f5;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
    }

    #photoInput {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 18px;
    }

    #sendButton {
      width: 100%;
      margin-top: 24px;
      border: none;
      padding: 15px;
      border-radius: 999px;
      background: #eab6c8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 14px;
      min-height: 20px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>届ける 💌</h1>

  <textarea
    id="messageInput"
    placeholder="メッセージを書く…"
  ></textarea>

  <div class="photo-area">

    <label class="file-label" for="photoInput">
      📷 写真を選ぶ
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

    <img id="preview">

  </div>

  <button id="sendButton">
    届ける 💌
  </button>

  <div id="status"></div>
  
<div id="currentPost" style="
  margin-top:32px;
  padding-top:24px;
  border-top:1px solid #f1e4e9;
  display:none;
">

  <div style="
    font-size:13px;
    color:#aaa;
    margin-bottom:14px;
  ">
    今届けているもの
  </div>

  <div id="currentMessage" style="
    font-size:17px;
    line-height:1.7;
    white-space:pre-wrap;
  "></div>

  <img
    id="currentPhoto"
    style="
      display:none;
      width:100%;
      max-height:360px;
      object-fit:cover;
      border-radius:20px;
      margin-top:16px;
    "
  >

  <div id="currentDate" style="
    margin-top:14px;
    font-size:12px;
    color:#aaa;
  "></div>

</div>
</div>


<script>

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";

const REST_URL =
  PROJECT_URL + "/rest/v1";

const STORAGE_URL =
  PROJECT_URL + "/storage/v1";

const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";

const BUCKET = "photos";

async function loadCurrentPost() {

  try {

    const response = await fetch(
      REST_URL +
      "/messages?select=message,photo_url,created_at&order=id.desc&limit=1",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("最新投稿を取得できませんでした");
    }

    const data = await response.json();

    if (data.length === 0) {
      return;
    }

    const post = data[0];

    const currentPost =
      document.getElementById("currentPost");

    const currentMessage =
      document.getElementById("currentMessage");

    const currentPhoto =
      document.getElementById("currentPhoto");

    const currentDate =
      document.getElementById("currentDate");


    currentPost.style.display =
      "block";


    /* メッセージ */

    currentMessage.textContent =
      post.message || "";


    /* 写真 */

    if (post.photo_url) {

      currentPhoto.src =
        post.photo_url;

      currentPhoto.style.display =
        "block";

    } else {

      currentPhoto.removeAttribute("src");

      currentPhoto.style.display =
        "none";

    }


    /* 時間 */

    const date =
      new Date(post.created_at);

    currentDate.textContent =
      date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

  } catch (error) {

    console.error(error);

  }

}
const messageInput =
  document.getElementById("messageInput");

const photoInput =
  document.getElementById("photoInput");

const preview =
  document.getElementById("preview");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");


/* 写真プレビュー */

photoInput.addEventListener("change", function () {

  const file = photoInput.files[0];

  if (!file) {

    preview.style.display = "none";

    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display =
    "block";

  document.getElementById("previewTitle").style.display =
  "block";
});


/* 届ける */

sendButton.addEventListener("click", async function () {

  const message =
    messageInput.value.trim();

  const file =
    photoInput.files[0];


  if (!message && !file) {

    status.textContent =
      "メッセージか写真を選んでね 💭";

    return;
  }


  sendButton.disabled = true;

  status.textContent =
    "届けています… 💌";


  try {

/* -----------------
   写真を先にアップロード
------------------ */

let photoUrl = null;

if (file) {

  const extension =
    file.name.includes(".")
      ? file.name.split(".").pop()
      : "jpg";

  const fileName =
    Date.now() + "." + extension;

  const photoResponse =
    await fetch(
      STORAGE_URL +
      "/object/" +
      BUCKET +
      "/" +
      fileName,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            file.type || "image/jpeg",

          "x-upsert": "false"
        },

        body: file
      }
    );

  if (!photoResponse.ok) {

    const errorText =
      await photoResponse.text();

    throw new Error(
      "写真送信失敗: " + errorText
    );
  }

  photoUrl =
    STORAGE_URL +
    "/object/public/" +
    BUCKET +
    "/" +
    encodeURIComponent(fileName);
}


/* -----------------
   メッセージ＋写真URLを
   1セットで保存
------------------ */

const messageResponse =
  await fetch(
    REST_URL + "/messages",
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,

        "Authorization":
          "Bearer " + SUPABASE_KEY,

        "Content-Type":
          "application/json",

        "Prefer":
          "return=minimal"
      },

      body: JSON.stringify({
        message: message || "",
        photo_url: photoUrl
      })
    }
  );

if (!messageResponse.ok) {

  const errorText =
    await messageResponse.text();

  throw new Error(
    "メッセージ送信失敗: " +
    errorText
  );
}              

  status.textContent = "届きました 💌♡";

await loadCurrentPost();
    
messageInput.value = "";
photoInput.value = "";

preview.style.display = "none";

const previewTitle =
  document.getElementById("previewTitle");

if (previewTitle) {
  previewTitle.style.display = "none";
}

  } catch (error) {

    console.error(error);

    status.textContent =
     "エラー：" + error.message;

  } finally {

    sendButton.disabled = false;

  }

});
  
loadCurrentPost();
  
</script>

</body>
</html>
