<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>for you</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      padding: 18px 16px 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;

      color: #24385f;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 10% 8%,
          rgba(255,255,255,0.22),
          transparent 23%
        ),
        radial-gradient(
          circle at 90% 16%,
          rgba(85,140,255,0.22),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(110,155,255,0.18),
          transparent 35%
        ),
        linear-gradient(
          165deg,
          #0c1b3d 0%,
          #10295c 40%,
          #173b7a 72%,
          #1f4c96 100%
        );
    }

    body::before {
      content: "✦";

      position: fixed;

      top: 9%;
      left: 6%;

      color:
        rgba(160,195,255,0.72);

      font-size: 13px;

      pointer-events: none;

      z-index: 0;

      text-shadow:
        38px 52px 0 rgba(255,255,255,0.95),
        92px 14px 0 rgba(170,205,255,0.72),
        148px 78px 0 rgba(255,255,255,0.9),
        210px 26px 0 rgba(140,185,255,0.68),
        278px 64px 0 rgba(255,255,255,0.9),
        320px 20px 0 rgba(175,210,255,0.72),
        24px 180px 0 rgba(255,255,255,0.9),
        110px 220px 0 rgba(150,195,255,0.62),
        196px 170px 0 rgba(255,255,255,0.86),
        286px 212px 0 rgba(160,205,255,0.62),
        42px 345px 0 rgba(255,255,255,0.9),
        138px 300px 0 rgba(135,180,245,0.58),
        250px 340px 0 rgba(255,255,255,0.88),
        322px 298px 0 rgba(165,205,255,0.64),
        18px 500px 0 rgba(255,255,255,0.88),
        102px 548px 0 rgba(135,180,245,0.58),
        212px 520px 0 rgba(255,255,255,0.92),
        306px 570px 0 rgba(165,205,255,0.64),
        56px 705px 0 rgba(255,255,255,0.9),
        176px 748px 0 rgba(150,195,255,0.62),
        298px 720px 0 rgba(255,255,255,0.92);
    }

    body::after {
      content: "☾";

      position: fixed;

      top: 10%;
      right: 7%;

      color:
        rgba(255,248,220,0.96);

      font-size: 48px;

      text-shadow:
        0 0 12px rgba(255,255,255,0.85),
        0 0 24px rgba(255,255,255,0.45);

      pointer-events: none;

      z-index: 0;

      opacity: 0.98;
    }

    .shooting-star {
      position: fixed;

      top: 17%;
      left: 17%;

      width: 72px;
      height: 1.5px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(170,210,255,0.86)
        );

      transform:
        rotate(-26deg);

      border-radius: 999px;

      pointer-events: none;

      z-index: 0;

      opacity: 0.9;
    }

    .shooting-star::after {
      content: "✦";

      position: absolute;

      right: -2px;
      top: -8px;

      font-size: 13px;

      color:
        rgba(255,255,255,0.95);

      text-shadow:
        0 0 8px rgba(255,255,255,0.75);
    }

    .page {
      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 460px;

      margin: 0 auto;
    }

    .title {
      margin: 4px 0 12px;

      text-align: center;

      font-size: 24px;

      font-weight: 650;

      color: #f7fbff;

      text-shadow:
        0 0 14px
        rgba(255,255,255,0.28);
    }

    .card {
      color: #24385f;

      width: 100%;

      margin-bottom: 10px;

      padding: 18px 16px;

      border:
        1px solid
        rgba(255,255,255,0.8);

      border-radius: 25px;

      background:
        rgba(245,249,255,0.90);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      box-shadow:
        0 12px 34px
        rgba(20,55,125,0.18);
    }

    .card-title {
      margin-bottom: 12px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;
    }

    #receivedMessage {
      padding: 12px 10px;

      border:
        1px solid
        rgba(120,165,240,0.45);

      border-radius: 17px;

      background:
        rgba(248,251,255,0.92);

      font-size: 17px;

      line-height: 1.5;

      text-align: center;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .loading {
      font-size: 13px !important;

      color: #7d8eaa;
    }

    #receivedPhotoArea {
      display: none;

      margin-top: 10px;
    }

    #receivedPhoto {
      width: 100%;

      max-height: 250px;

      object-fit: cover;

      border-radius: 16px;
    }

    #reactionArea {
      display: none;

      margin-top: 10px;

      padding-top: 10px;

      border-top:
        1px solid
        rgba(170,195,235,0.55);
    }

    .reaction-title {
      margin-bottom: 7px;

      text-align: center;

      font-size: 10px;

      color: #7d8eaa;
    }

    .reaction-buttons {
      display: flex;

      justify-content: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    .reaction-button {
      width: 42px;
      height: 42px;

      border: none;

      border-radius: 50%;

      background:
        rgba(233,241,255,0.96);

      font-size: 20px;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s,
        box-shadow 0.15s;
    }

    .reaction-button:active {
      transform: scale(0.9);
    }

    .reaction-button.selected {
      background: #cfe0ff;

      transform:
        scale(1.06);

      box-shadow:
        0 0 14px
        rgba(95,145,235,0.30);
    }

    #reactionStatus {
      min-height: 14px;

      margin-top: 6px;

      text-align: center;

      font-size: 10px;

      color: #7d8eaa;
    }

    #receivedDate {
      margin-top: 7px;

      text-align: center;

      font-size: 10px;

      color: #7d8eaa;
    }

    textarea {
      width: 100%;

      min-height: 78px;

      padding: 12px;

      border:
        1px solid
        #cddcf5;

      border-radius: 17px;

      resize: vertical;

      outline: none;

      background:
        rgba(248,251,255,0.96);

      font-size: 15px;

      line-height: 1.5;

      font-family: inherit;

      color: #24385f;
    }

    textarea:focus {
      border-color: #8fb3f5;

      box-shadow:
        0 0 0 3px
        rgba(95,145,235,0.10);
    }

    .photo-area {
      margin-top: 10px;

      text-align: center;
    }

    .file-label {
      display: inline-block;

      padding: 9px 15px;

      border-radius: 999px;

      background:
        rgba(228,238,255,0.96);

      cursor: pointer;

      font-size: 13px;
    }

    #photoInput {
      display: none;
    }

    #previewTitle {
      display: none;

      margin-top: 10px;

      font-size: 10px;

      color: #7d8eaa;
    }

    #preview {
      display: none;

      width: 100%;

      max-height: 240px;

      object-fit: cover;

      margin-top: 8px;

      border-radius: 16px;
    }

    #sendButton {
      width: 100%;

      margin-top: 12px;

      padding: 12px;

      border: none;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #3f6fd8,
          #5b86e5,
          #7aa7ff
        );

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
    }

    #status {
      min-height: 16px;

      margin-top: 8px;

      text-align: center;

      font-size: 11px;

      color: #71829f;
    }

    .scroll-guide {
      margin: 3px 0 12px;

      text-align: center;

      font-size: 10px;

      color:
        rgba(210,225,255,0.72);
    }

    .scroll-arrow {
      display: block;

      margin-top: 2px;

      font-size: 18px;
    }

    .history-card {
      padding: 20px 15px;
    }

    .history-heading {
      margin-bottom: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;
    }

    .history-item {
      margin-bottom: 10px;

      padding: 14px;

      border:
        1px solid
        rgba(170,195,235,0.55);

      border-radius: 17px;

      background:
        rgba(248,251,255,0.92);

      text-align: left;
    }

    .history-message {
      font-size: 14px;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .history-photo {
      width: 100%;

      max-height: 260px;

      object-fit: cover;

      margin-top: 9px;

      border-radius: 14px;
    }

    .history-date {
      margin-top: 8px;

      font-size: 10px;

      color: #7d8eaa;
    }

    .history-viewed {
      margin-top: 5px;

      font-size: 10px;

      color: #71829f;
    }

    .history-reaction {
      margin-top: 5px;

      font-size: 12px;
    }

    .empty-history {
      padding: 18px 8px;

      text-align: center;

      font-size: 12px;

      color: #7d8eaa;
    }

  </style>
</head>

<body>

<div class="shooting-star"></div>

<div class="page">

  <div class="title">
    for you
  </div>

  <div class="card">

    <div class="card-title">
      受け取る 💌
    </div>

    <div
      id="receivedMessage"
      class="loading"
    >
      読み込んでいます…
    </div>

    <div id="receivedPhotoArea">

      <img
        id="receivedPhoto"
        alt="received photo"
      >

    </div>

    <div id="reactionArea">

      <div class="reaction-title">
        気持ちを返す
      </div>

      <div class="reaction-buttons">

        <button
          class="reaction-button"
          data-reaction="🫶"
        >
          🫶
        </button>

        <button
          class="reaction-button"
          data-reaction="🤟"
        >
          🤟
        </button>

        <button
          class="reaction-button"
          data-reaction="🦄"
        >
          🦄
        </button>

        <button
          class="reaction-button"
          data-reaction="🧸"
        >
          🧸
        </button>

      </div>

      <div id="reactionStatus"></div>

    </div>

    <div id="receivedDate"></div>

  </div>


  <div class="card">

    <div class="card-title">
      届ける 💌
    </div>

    <textarea
      id="messageInput"
      placeholder="メッセージを書く…"
    ></textarea>

    <div class="photo-area">

      <label
        class="file-label"
        for="photoInput"
      >
        📷 写真を選ぶ
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

      <div id="previewTitle">
        今回届ける写真
      </div>

      <img
        id="preview"
        alt="preview"
      >

    </div>

    <button id="sendButton">
      届ける 💌
    </button>

    <div id="status"></div>

  </div>


  <div class="scroll-guide">
    下にスライドすると過去の履歴が見れる
    <span class="scroll-arrow">
      ⌄
    </span>
  </div>


  <div class="card history-card">

    <div class="history-heading">
      これまで届けたもの
    </div>

    <div id="historyList">
      読み込んでいます…
    </div>

  </div>

</div>


<script>

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";

const REST_URL =
  PROJECT_URL +
  "/rest/v1";

const STORAGE_URL =
  PROJECT_URL +
  "/storage/v1";

const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";

const BUCKET =
  "photos";


/*
  自分用ページ

  受け取る：
  彼女から

  届ける：
  自分として送る
*/

const RECEIVED_FROM =
  "her";

const SEND_AS =
  "me";


let currentReceivedPostId =
  null;


const receivedMessage =
  document.getElementById(
    "receivedMessage"
  );

const receivedPhotoArea =
  document.getElementById(
    "receivedPhotoArea"
  );

const receivedPhoto =
  document.getElementById(
    "receivedPhoto"
  );

const receivedDate =
  document.getElementById(
    "receivedDate"
  );

const reactionArea =
  document.getElementById(
    "reactionArea"
  );

const reactionStatus =
  document.getElementById(
    "reactionStatus"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const photoInput =
  document.getElementById(
    "photoInput"
  );

const preview =
  document.getElementById(
    "preview"
  );

const previewTitle =
  document.getElementById(
    "previewTitle"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const status =
  document.getElementById(
    "status"
  );

const historyList =
  document.getElementById(
    "historyList"
  );


async function loadLatestReceived() {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?select=id,message,photo_url,created_at,viewed_at,reaction,sender" +

        "&sender=eq." +
        encodeURIComponent(
          RECEIVED_FROM
        ) +

        "&order=id.desc" +

        "&limit=1",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const data =
      await response.json();


    receivedMessage
      .classList
      .remove(
        "loading"
      );


    if (data.length === 0) {

      currentReceivedPostId =
        null;


      receivedMessage.textContent =
        "まだ届いていません 💭";


      receivedPhotoArea.style.display =
        "none";


      reactionArea.style.display =
        "none";


      receivedDate.textContent =
        "";


      return;

    }


    const post =
      data[0];


    currentReceivedPostId =
      post.id;


    receivedMessage.textContent =
      post.message ||
      "";


    if (post.photo_url) {

      receivedPhoto.src =
        post.photo_url;


      receivedPhotoArea.style.display =
        "block";

    } else {

      receivedPhoto
        .removeAttribute(
          "src"
        );


      receivedPhotoArea.style.display =
        "none";

    }


    reactionArea.style.display =
      "block";


    updateReactionButtons(
      post.reaction
    );


    receivedDate.textContent =
      new Date(
        post.created_at
      )
      .toLocaleString(
        "ja-JP",
        {
          year:
            "numeric",

          month:
            "long",

          day:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      );


    if (!post.viewed_at) {

      await markAsViewed(
        post.id
      );

    }


  } catch (error) {

    console.error(
      error
    );


    receivedMessage
      .classList
      .remove(
        "loading"
      );


    receivedMessage.textContent =
      "読み込めませんでした 🥲";

  }

}


async function markAsViewed(
  postId
) {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?id=eq." +
        postId +

        "&viewed_at=is.null",

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              {
                viewed_at:
                  new Date()
                    .toISOString()
              }
            )

        }

      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


  } catch (error) {

    console.error(
      error
    );

  }

}


async function saveReaction(
  reaction
) {

  if (!currentReceivedPostId) {

    return;

  }


  reactionStatus.textContent =
    "届けています…";


  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?id=eq." +
        currentReceivedPostId,

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              {
                reaction:
                  reaction
              }
            )

        }

      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    updateReactionButtons(
      reaction
    );


    reactionStatus.textContent =
      "届きました ♡";


    setTimeout(
      function() {

        reactionStatus.textContent =
          "";

      },
      1400
    );


  } catch (error) {

    console.error(
      error
    );


    reactionStatus.textContent =
      "送れませんでした 🥲";

  }

}


function updateReactionButtons(
  reaction
) {

  document
    .querySelectorAll(
      ".reaction-button"
    )
    .forEach(
      function(button) {

        if (
          button.dataset.reaction ===
          reaction
        ) {

          button
            .classList
            .add(
              "selected"
            );

        } else {

          button
            .classList
            .remove(
              "selected"
            );

        }

      }
    );

}


document
  .querySelectorAll(
    ".reaction-button"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          saveReaction(
            button.dataset.reaction
          );

        }
      );

    }
  );


photoInput.addEventListener(
  "change",
  function() {

    const file =
      photoInput.files[0];


    if (!file) {

      preview.style.display =
        "none";


      previewTitle.style.display =
        "none";


      preview
        .removeAttribute(
          "src"
        );


      return;

    }


    preview.src =
      URL.createObjectURL(
        file
      );


    preview.style.display =
      "block";


    previewTitle.style.display =
      "block";

  }
);


sendButton.addEventListener(
  "click",
  async function() {

    const message =
      messageInput
        .value
        .trim();


    const file =
      photoInput.files[0];


    if (!message && !file) {

      status.textContent =
        "メッセージか写真を選んでね 💭";


      return;

    }


    sendButton.disabled =
      true;


    status.textContent =
      "届けています… 💌";


    let photoUrl =
      null;


    try {


      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
            : "jpg";


        const fileName =
          SEND_AS +
          "_" +
          Date.now() +
          "." +
          extension;


        const photoResponse =
          await fetch(

            STORAGE_URL +

            "/object/" +

            BUCKET +

            "/" +

            fileName,

            {

              method:
                "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Content-Type":
                  file.type ||
                  "image/jpeg",

                "x-upsert":
                  "false"

              },

              body:
                file

            }

          );


        if (!photoResponse.ok) {

          throw new Error(
            "写真送信失敗: " +
            await photoResponse.text()
          );

        }


        photoUrl =
          STORAGE_URL +

          "/object/public/" +

          BUCKET +

          "/" +

          encodeURIComponent(
            fileName
          );

      }


      const messageResponse =
        await fetch(

          REST_URL +
          "/messages",

          {

            method:
              "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(
                {

                  message:
                    message ||
                    "",

                  photo_url:
                    photoUrl,

                  viewed_at:
                    null,

                  reaction:
                    null,

                  sender:
                    SEND_AS

                }
              )

          }

        );


      if (!messageResponse.ok) {

        throw new Error(
          "メッセージ送信失敗: " +
          await messageResponse.text()
        );

      }


      status.textContent =
        "届きました 💌♡";


      messageInput.value =
        "";


      photoInput.value =
        "";


      preview.style.display =
        "none";


      previewTitle.style.display =
        "none";


      preview
        .removeAttribute(
          "src"
        );


      await loadHistory();


      setTimeout(
        function() {

          status.textContent =
            "";

        },
        1800
      );


    } catch (error) {

      console.error(
        error
      );


      status.textContent =
        "エラー：" +
        error.message;

    } finally {

      sendButton.disabled =
        false;

    }

  }
);


async function loadHistory() {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?select=id,message,photo_url,created_at,viewed_at,reaction,sender" +

        "&sender=eq." +
        encodeURIComponent(
          SEND_AS
        ) +

        "&order=id.desc" +

        "&limit=50",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    const posts =
      await response.json();


    historyList.innerHTML =
      "";


    if (posts.length === 0) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "empty-history";


      empty.textContent =
        "まだ届けたものはありません 💭";


      historyList.appendChild(
        empty
      );


      return;

    }


    posts.forEach(
      function(post) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "history-item";


        if (post.message) {

          const message =
            document.createElement(
              "div"
            );


          message.className =
            "history-message";


          message.textContent =
            post.message;


          item.appendChild(
            message
          );

        }


        if (post.photo_url) {

          const img =
            document.createElement(
              "img"
            );


          img.className =
            "history-photo";


          img.src =
            post.photo_url;


          img.alt =
            "history photo";


          item.appendChild(
            img
          );

        }


        const dateText =
          document.createElement(
            "div"
          );


        dateText.className =
          "history-date";


        dateText.textContent =
          "送信：" +
          new Date(
            post.created_at
          )
          .toLocaleString(
            "ja-JP",
            {
              year:
                "numeric",

              month:
                "long",

              day:
                "numeric",

              hour:
                "2-digit",

              minute:
                "2-digit"
            }
          );


        item.appendChild(
          dateText
        );


        const viewed =
          document.createElement(
            "div"
          );


        viewed.className =
          "history-viewed";


        if (post.viewed_at) {

          viewed.textContent =
            "見てくれた ✓ " +
            new Date(
              post.viewed_at
            )
            .toLocaleString(
              "ja-JP",
              {
                month:
                  "long",

                day:
                  "numeric",

                hour:
                  "2-digit",

                minute:
                  "2-digit"
              }
            );

        } else {

          viewed.textContent =
            "まだ見ていません";

        }


        item.appendChild(
          viewed
        );


        const reaction =
          document.createElement(
            "div"
          );


        reaction.className =
          "history-reaction";


        if (post.reaction) {

          reaction.textContent =
            "リアクション：" +
            post.reaction;

        } else {

          reaction.textContent =
            "リアクションはまだありません";

        }


        item.appendChild(
          reaction
        );


        historyList.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    historyList.textContent =
      "履歴を読み込めませんでした 🥲";

  }

}


loadLatestReceived();
loadHistory();


setInterval(
  function() {

    loadLatestReceived();
    loadHistory();

  },
  5000
);


</script>

</body>
</html>
