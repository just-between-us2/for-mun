<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>for you</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;padding:18px 16px 50px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:#3b3340;overflow-x:hidden;
  background:
    radial-gradient(circle at 10% 8%,rgba(255,255,255,.92),transparent 23%),
    radial-gradient(circle at 90% 16%,rgba(255,217,238,.75),transparent 28%),
    radial-gradient(circle at 50% 80%,rgba(234,220,255,.5),transparent 35%),
    linear-gradient(165deg,#fff9fc 0%,#fceaf3 40%,#f6ddeb 72%,#eadff7 100%)
}
body::before{
  content:"✦";position:fixed;top:9%;left:6%;font-size:13px;
  color:rgba(170,145,220,.52);pointer-events:none;z-index:0;
  text-shadow:
    38px 52px 0 rgba(255,255,255,.9),
    92px 14px 0 rgba(190,160,230,.5),
    148px 78px 0 rgba(255,255,255,.85),
    210px 26px 0 rgba(180,145,220,.5),
    278px 64px 0 rgba(255,255,255,.88),
    320px 20px 0 rgba(188,155,228,.5),
    24px 180px 0 rgba(255,255,255,.86),
    110px 220px 0 rgba(185,150,225,.45),
    196px 170px 0 rgba(255,255,255,.82),
    286px 212px 0 rgba(190,160,230,.45),
    42px 345px 0 rgba(255,255,255,.88),
    138px 300px 0 rgba(180,145,220,.42),
    250px 340px 0 rgba(255,255,255,.84),
    322px 298px 0 rgba(190,155,228,.46),
    18px 500px 0 rgba(255,255,255,.84),
    102px 548px 0 rgba(180,145,220,.42),
    212px 520px 0 rgba(255,255,255,.9),
    306px 570px 0 rgba(188,155,228,.45),
    56px 705px 0 rgba(255,255,255,.86),
    176px 748px 0 rgba(185,150,225,.45),
    298px 720px 0 rgba(255,255,255,.88)
}
body::after{
  content:"☾";position:fixed;top:10%;right:7%;font-size:48px;
  color:rgba(255,255,255,.95);pointer-events:none;z-index:0;opacity:.95;
  text-shadow:0 0 12px rgba(255,255,255,.75),0 0 24px rgba(255,255,255,.45)
}
.shooting-star{
  position:fixed;top:17%;left:17%;width:72px;height:1.5px;z-index:0;
  pointer-events:none;opacity:.9;border-radius:999px;transform:rotate(-26deg);
  background:linear-gradient(90deg,transparent,rgba(175,145,220,.68))
}
.shooting-star::after{
  content:"✦";position:absolute;right:-2px;top:-8px;font-size:13px;
  color:rgba(255,255,255,.9);text-shadow:0 0 8px rgba(255,255,255,.65)
}
.page{position:relative;z-index:1;width:100%;max-width:460px;margin:0 auto}
.title{margin:4px 0 12px;text-align:center;font-size:24px;font-weight:650}
.card{
  width:100%;margin-bottom:10px;padding:18px 16px;border-radius:25px;
  border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.80);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(178,105,145,.12)
}
.card-title{margin-bottom:12px;text-align:center;font-size:18px;font-weight:700}
#receivedMessage{
  padding:12px 10px;border:1px solid rgba(234,182,200,.5);border-radius:17px;
  background:rgba(255,248,251,.82);font-size:17px;line-height:1.5;
  text-align:center;white-space:pre-wrap;word-break:break-word
}
.loading{font-size:13px!important;color:#aaa}
#receivedPhotoArea{display:none;margin-top:10px}
#receivedPhoto{width:100%;max-height:250px;object-fit:cover;border-radius:16px}
#reactionArea{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(235,210,220,.8)}
.reaction-title{margin-bottom:7px;text-align:center;font-size:10px;color:#aaa}
.reaction-buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.reaction-button{
  width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,239,246,.95);
  font-size:20px;cursor:pointer
}
.reaction-button.selected{background:#f5c9da;transform:scale(1.06);box-shadow:0 0 14px rgba(231,155,187,.30)}
#reactionStatus,#receivedDate{margin-top:7px;min-height:14px;text-align:center;font-size:10px;color:#aaa}
textarea{
  width:100%;min-height:78px;padding:12px;border:1px solid #efd4df;border-radius:17px;
  resize:vertical;outline:none;background:rgba(255,249,252,.9);
  font:15px/1.5 inherit;color:#3d3440
}
.photo-area{margin-top:10px;text-align:center}
.file-label{display:inline-block;padding:9px 15px;border-radius:999px;background:rgba(255,233,243,.95);font-size:13px;cursor:pointer}
#photoInput{display:none}
#previewTitle{display:none;margin-top:10px;font-size:10px;color:#aaa}
#preview{display:none;width:100%;max-height:240px;object-fit:cover;margin-top:8px;border-radius:16px}
#sendButton{
  width:100%;margin-top:12px;padding:12px;border:0;border-radius:999px;
  background:linear-gradient(90deg,#e6a3bd,#ecaac7,#e4b2da);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer
}
#sendButton:disabled{opacity:.5}
#status{min-height:16px;margin-top:8px;text-align:center;font-size:11px;color:#999}
.scroll-guide{margin:3px 0 12px;text-align:center;font-size:10px;color:rgba(130,90,120,.62)}
.scroll-arrow{display:block;margin-top:2px;font-size:18px}
.history-card{padding:20px 15px}
.history-heading{margin-bottom:14px;text-align:center;font-size:18px;font-weight:700}
.history-item{
  margin-bottom:10px;padding:14px;border:1px solid rgba(238,211,223,.8);
  border-radius:17px;background:rgba(255,249,252,.8);text-align:left
}
.history-message{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.history-photo{width:100%;max-height:260px;object-fit:cover;margin-top:9px;border-radius:14px}
.history-date,.history-viewed{margin-top:5px;font-size:10px;color:#999}
.history-date{margin-top:8px;color:#aaa}
.history-reaction{margin-top:5px;font-size:12px}
.empty-history{padding:18px 8px;text-align:center;font-size:12px;color:#aaa}

    .history-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .delete-history-button {
      border: 1px solid #efc7d7;
      background: rgba(255,235,243,.96);
      color: #b45d7d;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }

    .delete-history-button:disabled {
      opacity: .5;
    }

</style>
</head>
<body>

<div class="shooting-star"></div>

<div class="page">
  <div class="title">for you</div>

  <div class="card">
    <div class="card-title">受け取る 💌</div>

    <div id="receivedMessage" class="loading">読み込んでいます…</div>

    <div id="receivedPhotoArea">
      <img id="receivedPhoto" alt="received photo">
    </div>

    <div id="reactionArea">
      <div class="reaction-title">気持ちを返す</div>

      <div class="reaction-buttons">
        <button class="reaction-button" data-reaction="🫶">🫶</button>
        <button class="reaction-button" data-reaction="🤟">🤟</button>
        <button class="reaction-button" data-reaction="🦄">🦄</button>
        <button class="reaction-button" data-reaction="🧸">🧸</button>
      </div>

      <div id="reactionStatus"></div>
    </div>

    <div id="receivedDate"></div>
  </div>

  <div class="card">
    <div class="card-title">届ける 💌</div>

    <textarea id="messageInput" placeholder="メッセージを書く…"></textarea>

    <div class="photo-area">
      <label class="file-label" for="photoInput">📷 写真を選ぶ</label>
      <input id="photoInput" type="file" accept="image/*">
      <div id="previewTitle">今回届ける写真</div>
      <img id="preview" alt="preview">
    </div>

    <button id="sendButton">届ける 💌</button>
    <div id="status"></div>
  </div>

  <div class="scroll-guide">
    下にスライドすると過去の履歴が見れる
    <span class="scroll-arrow">⌄</span>
  </div>

  <div class="card history-card">
    <div class="history-heading">これまで届けたもの</div>
    <div id="historyList">読み込んでいます…</div>
  </div>
</div>

<script>
const PROJECT_URL="https://pwuhcajvuwoumgzcrzcu.supabase.co";
const REST_URL=PROJECT_URL+"/rest/v1";
const STORAGE_URL=PROJECT_URL+"/storage/v1";
const SUPABASE_KEY="sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";
const BUCKET="photos";
const RECEIVED_FROM="me";
const SEND_AS="her";

let currentReceivedPostId=null;

const receivedMessage=document.getElementById("receivedMessage");
const receivedPhotoArea=document.getElementById("receivedPhotoArea");
const receivedPhoto=document.getElementById("receivedPhoto");
const receivedDate=document.getElementById("receivedDate");
const reactionArea=document.getElementById("reactionArea");
const reactionStatus=document.getElementById("reactionStatus");
const messageInput=document.getElementById("messageInput");
const photoInput=document.getElementById("photoInput");
const preview=document.getElementById("preview");
const previewTitle=document.getElementById("previewTitle");
const sendButton=document.getElementById("sendButton");
const status=document.getElementById("status");
const historyList=document.getElementById("historyList");

async function loadLatestReceived(){
  try{
    const r=await fetch(
      REST_URL+"/messages?select=id,message,photo_url,created_at,viewed_at,reaction,sender&sender=eq."+
      encodeURIComponent(RECEIVED_FROM)+"&order=id.desc&limit=1",
      {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}}
    );

    if(!r.ok) throw new Error(await r.text());

    const data=await r.json();
    receivedMessage.classList.remove("loading");

    if(data.length===0){
      currentReceivedPostId=null;
      receivedMessage.textContent="まだ届いていません 💭";
      receivedPhotoArea.style.display="none";
      reactionArea.style.display="none";
      receivedDate.textContent="";
      return;
    }

    const post=data[0];
    currentReceivedPostId=post.id;
    receivedMessage.textContent=post.message||"";

    if(post.photo_url){
      receivedPhoto.src=post.photo_url;
      receivedPhotoArea.style.display="block";
    }else{
      receivedPhoto.removeAttribute("src");
      receivedPhotoArea.style.display="none";
    }

    reactionArea.style.display="block";
    updateReactionButtons(post.reaction);

    receivedDate.textContent=new Date(post.created_at).toLocaleString("ja-JP",{
      year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"
    });

    if(!post.viewed_at) await markAsViewed(post.id);

  }catch(e){
    console.error(e);
    receivedMessage.classList.remove("loading");
    receivedMessage.textContent="読み込めませんでした 🥲";
  }
}

async function markAsViewed(postId){
  try{
    const r=await fetch(
      REST_URL+"/messages?id=eq."+postId+"&viewed_at=is.null",
      {
        method:"PATCH",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({viewed_at:new Date().toISOString()})
      }
    );
    if(!r.ok) throw new Error(await r.text());
  }catch(e){
    console.error(e);
  }
}

async function saveReaction(reaction){
  if(!currentReceivedPostId) return;

  reactionStatus.textContent="届けています…";

  try{
    const r=await fetch(
      REST_URL+"/messages?id=eq."+currentReceivedPostId,
      {
        method:"PATCH",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({reaction})
      }
    );

    if(!r.ok) throw new Error(await r.text());

    updateReactionButtons(reaction);
    reactionStatus.textContent="届きました ♡";
    setTimeout(()=>reactionStatus.textContent="",1400);

  }catch(e){
    console.error(e);
    reactionStatus.textContent="送れませんでした 🥲";
  }
}

function updateReactionButtons(reaction){
  document.querySelectorAll(".reaction-button").forEach(button=>{
    button.classList.toggle("selected",button.dataset.reaction===reaction);
  });
}

document.querySelectorAll(".reaction-button").forEach(button=>{
  button.addEventListener("click",()=>saveReaction(button.dataset.reaction));
});

photoInput.addEventListener("change",()=>{
  const file=photoInput.files[0];

  if(!file){
    preview.style.display="none";
    previewTitle.style.display="none";
    preview.removeAttribute("src");
    return;
  }

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
  previewTitle.style.display="block";
});

sendButton.addEventListener("click",async()=>{
  const message=messageInput.value.trim();
  const file=photoInput.files[0];

  if(!message&&!file){
    status.textContent="メッセージか写真を選んでね 💭";
    return;
  }

  sendButton.disabled=true;
  status.textContent="届けています… 💌";

  let photoUrl=null;

  try{
    if(file){
      const ext=file.name.includes(".")?file.name.split(".").pop():"jpg";
      const fileName=SEND_AS+"_"+Date.now()+"."+ext;

      const photoResponse=await fetch(
        STORAGE_URL+"/object/"+BUCKET+"/"+fileName,
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY,
            "Content-Type":file.type||"image/jpeg",
            "x-upsert":"false"
          },
          body:file
        }
      );

      if(!photoResponse.ok){
        throw new Error("写真送信失敗: "+await photoResponse.text());
      }

      photoUrl=STORAGE_URL+"/object/public/"+BUCKET+"/"+encodeURIComponent(fileName);
    }

    const messageResponse=await fetch(
      REST_URL+"/messages",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          message:message||"",
          photo_url:photoUrl,
          viewed_at:null,
          reaction:null,
          sender:SEND_AS
        })
      }
    );

    if(!messageResponse.ok){
      throw new Error("メッセージ送信失敗: "+await messageResponse.text());
    }

    status.textContent="届きました 💌♡";
    messageInput.value="";
    photoInput.value="";
    preview.style.display="none";
    previewTitle.style.display="none";
    preview.removeAttribute("src");

    await loadHistory();
    setTimeout(()=>status.textContent="",1800);

  }catch(e){
    console.error(e);
    status.textContent="エラー："+e.message;
  }finally{
    sendButton.disabled=false;
  }
});


async function deleteHistory(post){
  const ok = window.confirm(
    "この履歴を削除しますか？\n相手側からもこのメッセージが消えます。"
  );

  if(!ok) return;

  try{
    const response = await fetch(
      REST_URL + "/messages?id=eq." + post.id,
      {
        method: "DELETE",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=minimal"
        }
      }
    );

    if(!response.ok){
      throw new Error(await response.text());
    }

    await loadHistory();
    await loadLatestReceived();

  }catch(e){
    console.error(e);
    alert("削除できませんでした 🥲");
  }
}

async function loadHistory(){
  try{
    const r=await fetch(
      REST_URL+"/messages?select=id,message,photo_url,created_at,viewed_at,reaction,sender&sender=eq."+
      encodeURIComponent(SEND_AS)+"&order=id.desc&limit=50",
      {headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}}
    );

    if(!r.ok) throw new Error(await r.text());

    const posts=await r.json();
    historyList.innerHTML="";

    if(posts.length===0){
      const empty=document.createElement("div");
      empty.className="empty-history";
      empty.textContent="まだ届けたものはありません 💭";
      historyList.appendChild(empty);
      return;
    }

    posts.forEach(post=>{
      const item=document.createElement("div");
      item.className="history-item";

      if(post.message){
        const m=document.createElement("div");
        m.className="history-message";
        m.textContent=post.message;
        item.appendChild(m);
      }

      if(post.photo_url){
        const img=document.createElement("img");
        img.className="history-photo";
        img.src=post.photo_url;
        img.alt="history photo";
        item.appendChild(img);
      }

      const d=document.createElement("div");
      d.className="history-date";
      d.textContent="送信："+new Date(post.created_at).toLocaleString("ja-JP",{
        year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"
      });
      item.appendChild(d);

      const v=document.createElement("div");
      v.className="history-viewed";
      v.textContent=post.viewed_at
        ?"見てくれた ✓ "+new Date(post.viewed_at).toLocaleString("ja-JP",{
            month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"
          })
        :"まだ見ていません";
      item.appendChild(v);

      const re=document.createElement("div");
      re.className="history-reaction";
      re.textContent=post.reaction
        ?"リアクション："+post.reaction
        :"リアクションはまだありません";
      item.appendChild(re);

      const actions=document.createElement("div");
      actions.className="history-actions";

      const deleteButton=document.createElement("button");
      deleteButton.type="button";
      deleteButton.className="delete-history-button";
      deleteButton.textContent="削除";
      deleteButton.addEventListener("click",()=>deleteHistory(post));

      actions.appendChild(deleteButton);
      item.appendChild(actions);

      historyList.appendChild(item);
    });

  }catch(e){
    console.error(e);
    historyList.textContent="履歴を読み込めませんでした 🥲";
  }
}

loadLatestReceived();
loadHistory();

setInterval(()=>{
  loadLatestReceived();
  loadHistory();
},5000);
</script>

</body>
</html>
