<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きみへ 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Noto Sans JP", sans-serif;
      background:
        radial-gradient(circle at top left, #fff0f5, transparent 45%),
        linear-gradient(160deg, #fffafa, #ffeef4);
      color: #333;
    }

    body::before {
      content: "✦";
      position: fixed;
      top: 10%;
      left: 7%;
      color: rgba(170, 160, 215, 0.32);
      font-size: 14px;
      pointer-events: none;
      z-index: 0;

      text-shadow:
        75px 95px 0 rgba(170,160,215,0.22),
        165px 25px 0 rgba(170,160,215,0.30),
        270px 125px 0 rgba(170,160,215,0.20),
        35px 280px 0 rgba(170,160,215,0.25),
        145px 360px 0 rgba(170,160,215,0.18),
        300px 300px 0 rgba(170,160,215,0.25),
        80px 520px 0 rgba(170,160,215,0.18),
        250px 600px 0 rgba(170,160,215,0.22);
    }

    body::after {
      content: "☾";
      position: fixed;
      top: 11%;
      right: 10%;
      color: rgba(255, 255, 255, 0.72);
      font-size: 42px;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.45);
      pointer-events: none;
      z-index: 0;
    }

    .shooting-star {
      position: fixed;
      top: 22%;
      left: 18%;
      width: 55px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(190, 180, 225, 0.55)
      );
      transform: rotate(-25deg);
      border-radius: 999px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 0;
    }

    .shooting-star::after {
      content: "✦";
      position: absolute;
      right: -1px;
      top: -8px;
      color: rgba(170, 160, 215, 0.55);
      font-size: 13px;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.92);
      border-radius: 28px;
      padding: 38px 25px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(180, 100, 130, 0.15);
    }

    h1 {
      font-size: 20px;
      margin: 0 0 28px;
      font-weight: 600;
    }

    #message {
      font-size: 21px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #date {
      margin-top: 28px;
      font-size: 12px;
      color: #aaa;
    }

    .loading {
      color: #aaa;
      font-size: 16px;
    }

    #photoArea {
      display: none;
      margin-top: 26px;
    }

    #latestPhoto {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(150, 100, 120, 0.12);
    }
  </style>
</head>

<body>

<div class="shooting-star"></div>

<div class="card">

  <h1>for you</h1>

  <div id="message" class="loading">
    メッセージを読み込んでいます…
  </div>

  <div id="date"></div>

  <div id="photoArea">
    <img id="latestPhoto" alt="latest photo">
  </div>

</div>

<script>

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";

const REST_URL =
  PROJECT_URL + "/rest/v1";

const STORAGE_URL =
  PROJECT_URL + "/storage/v1";

const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";

const BUCKET = "photos";


async function loadMessage() {

  try {

    const response = await fetch(
      REST_URL +
      "/messages?select=message,created_at&order=id.desc&limit=1",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("読み込み失敗");
    }

    const data = await response.json();

    if (data.length === 0) {

      document.getElementById("message").textContent =
        "まだメッセージはありません 💭";

      return;
    }

    document
      .getElementById("message")
      .classList.remove("loading");

    document.getElementById("message").textContent =
      data[0].message;

    const date =
      new Date(data[0].created_at);

    document.getElementById("date").textContent =
      date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

  } catch (error) {

    document.getElementById("message").textContent =
      "メッセージを読み込めませんでした 🥲";

  }

}


async function loadLatestPhoto() {

  try {

    const response = await fetch(
      STORAGE_URL + "/object/list/" + BUCKET,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          prefix: "",
          limit: 1,
          offset: 0,
          sortBy: {
            column: "created_at",
            order: "desc"
          }
        })
      }
    );

    if (!response.ok) {
      throw new Error("写真取得失敗");
    }

    const files = await response.json();

    if (!files.length) {
      return;
    }

    const fileName = files[0].name;

    const publicUrl =
      STORAGE_URL +
      "/object/public/" +
      BUCKET +
      "/" +
      encodeURIComponent(fileName);

    document.getElementById("latestPhoto").src =
      publicUrl;

    document.getElementById("photoArea").style.display =
      "block";

  } catch (error) {

    console.error(error);

  }

}


loadMessage();
loadLatestPhoto();

</script>

</body>
</html>
