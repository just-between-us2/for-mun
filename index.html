<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>for you</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      padding:
        18px 16px
        50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;

      color: #3b3340;

      background:
        radial-gradient(
          circle at 10% 8%,
          rgba(255,255,255,0.92),
          transparent 23%
        ),
        radial-gradient(
          circle at 90% 16%,
          rgba(255,217,238,0.75),
          transparent 28%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(234,220,255,0.5),
          transparent 35%
        ),
        linear-gradient(
          165deg,
          #fff9fc 0%,
          #fceaf3 40%,
          #f6ddeb 72%,
          #eadff7 100%
        );

      overflow-x: hidden;
    }


    /* -------------------------
       星空
    -------------------------- */

    body::before {
      content: "✦";

      position: fixed;

      top: 9%;
      left: 6%;

      color:
        rgba(170,145,220,0.52);

      font-size: 13px;

      pointer-events: none;

      z-index: 0;

      text-shadow:
        38px 52px 0 rgba(255,255,255,0.9),
        92px 14px 0 rgba(190,160,230,0.5),
        148px 78px 0 rgba(255,255,255,0.85),
        210px 26px 0 rgba(180,145,220,0.5),
        278px 64px 0 rgba(255,255,255,0.88),
        320px 20px 0 rgba(188,155,228,0.5),

        24px 180px 0 rgba(255,255,255,0.86),
        110px 220px 0 rgba(185,150,225,0.45),
        196px 170px 0 rgba(255,255,255,0.82),
        286px 212px 0 rgba(190,160,230,0.45),

        42px 345px 0 rgba(255,255,255,0.88),
        138px 300px 0 rgba(180,145,220,0.42),
        250px 340px 0 rgba(255,255,255,0.84),
        322px 298px 0 rgba(190,155,228,0.46),

        18px 500px 0 rgba(255,255,255,0.84),
        102px 548px 0 rgba(180,145,220,0.42),
        212px 520px 0 rgba(255,255,255,0.9),
        306px 570px 0 rgba(188,155,228,0.45),

        56px 705px 0 rgba(255,255,255,0.86),
        176px 748px 0 rgba(185,150,225,0.45),
        298px 720px 0 rgba(255,255,255,0.88);
    }


    body::after {
      content: "☾";

      position: fixed;

      top: 10%;
      right: 7%;

      color:
        rgba(255,255,255,0.95);

      font-size: 48px;

      text-shadow:
        0 0 12px rgba(255,255,255,0.75),
        0 0 24px rgba(255,255,255,0.45);

      pointer-events: none;

      z-index: 0;

      opacity: 0.95;
    }


    .shooting-star {
      position: fixed;

      top: 17%;
      left: 17%;

      width: 72px;
      height: 1.5px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(175,145,220,0.68)
        );

      transform:
        rotate(-26deg);

      border-radius: 999px;

      pointer-events: none;

      z-index: 0;

      opacity: 0.9;
    }


    .shooting-star::after {
      content: "✦";

      position: absolute;

      right: -2px;
      top: -8px;

      font-size: 13px;

      color:
        rgba(255,255,255,0.9);

      text-shadow:
        0 0 8px rgba(255,255,255,0.65);
    }


    .page {
      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 460px;

      margin: 0 auto;
    }


    .title {
      margin:
        4px 0
        12px;

      text-align: center;

      font-size: 24px;

      font-weight: 650;

      letter-spacing: 0.02em;
    }


    .card {
      width: 100%;

      margin-bottom: 10px;

      padding:
        18px 16px;

      border:
        1px solid
        rgba(255,255,255,0.8);

      border-radius: 25px;

      background:
        rgba(255,255,255,0.80);

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      box-shadow:
        0 12px 34px
        rgba(178,105,145,0.12);
    }


    .card-title {
      margin-bottom: 12px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;
    }


    /* -------------------------
       受け取る
    -------------------------- */

    #receivedMessage {
      padding:
        12px 10px;

      border:
        1px solid
        rgba(234,182,200,0.5);

      border-radius: 17px;

      background:
        rgba(255,248,251,0.82);

      font-size: 17px;

      line-height: 1.5;

      text-align: center;

      white-space: pre-wrap;

      word-break: break-word;
    }


    .loading {
      font-size: 13px !important;

      color: #aaa;
    }


    #receivedPhotoArea {
      display: none;

      margin-top: 10px;
    }


    #receivedPhoto {
      width: 100%;

      max-height: 250px;

      object-fit: cover;

      border-radius: 16px;

      box-shadow:
        0 6px 18px
        rgba(150,100,120,0.12);
    }


    #reactionArea {
      display: none;

      margin-top: 10px;

      padding-top: 10px;

      border-top:
        1px solid
        rgba(235,210,220,0.8);
    }


    .reaction-title {
      margin-bottom: 7px;

      text-align: center;

      font-size: 10px;

      color: #aaa;
    }


    .reaction-buttons {
      display: flex;

      justify-content: center;

      gap: 8px;

      flex-wrap: wrap;
    }


    .reaction-button {
      width: 42px;
      height: 42px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,239,246,0.95);

      font-size: 20px;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s,
        box-shadow 0.15s;
    }


    .reaction-button:active {
      transform: scale(0.9);
    }


    .reaction-button.selected {
      background: #f5c9da;

      transform: scale(1.06);

      box-shadow:
        0 0 14px
        rgba(231,155,187,0.30);
    }


    #reactionStatus {
      min-height: 14px;

      margin-top: 6px;

      text-align: center;

      font-size: 10px;

      color: #aaa;
    }


    #receivedDate {
      margin-top: 7px;

      text-align: center;

      font-size: 10px;

      color: #aaa;
    }


    /* -------------------------
       届ける
    -------------------------- */

    textarea {
      width: 100%;

      min-height: 78px;

      padding: 12px;

      border:
        1px solid
        #efd4df;

      border-radius: 17px;

      resize: vertical;

      outline: none;

      background:
        rgba(255,249,252,0.9);

      font-size: 15px;

      line-height: 1.5;

      font-family: inherit;

      color: #3d3440;
    }


    textarea:focus {
      border-color: #e6acc3;

      box-shadow:
        0 0 0 3px
        rgba(235,180,202,0.10);
    }


    .photo-area {
      margin-top: 10px;

      text-align: center;
    }


    .file-label {
      display: inline-block;

      padding:
        9px 15px;

      border-radius: 999px;

      background:
        rgba(255,233,243,0.95);

      cursor: pointer;

      font-size: 13px;
    }


    #photoInput {
      display: none;
    }


    #previewTitle {
      display: none;

      margin-top: 10px;

      font-size: 10px;

      color: #aaa;
    }


    #preview {
      display: none;

      width: 100%;

      max-height: 240px;

      object-fit: cover;

      margin-top: 8px;

      border-radius: 16px;
    }


    #sendButton {
      width: 100%;

      margin-top: 12px;

      padding: 12px;

      border: none;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #e6a3bd,
          #ecaac7,
          #e4b2da
        );

      box-shadow:
        0 7px 18px
        rgba(218,135,174,0.22);

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }


    #sendButton:disabled {
      opacity: 0.5;
    }


    #status {
      min-height: 16px;

      margin-top: 8px;

      text-align: center;

      font-size: 11px;

      color: #999;
    }


    .scroll-guide {
      margin:
        3px 0
        12px;

      text-align: center;

      font-size: 10px;

      color:
        rgba(130,90,120,0.62);
    }


    .scroll-arrow {
      display: block;

      margin-top: 2px;

      font-size: 18px;
    }


    /* -------------------------
       履歴
    -------------------------- */

    .history-card {
      padding:
        20px 15px;
    }


    .history-heading {
      margin-bottom: 14px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;
    }


    .history-item {
      margin-bottom: 10px;

      padding: 14px;

      border:
        1px solid
        rgba(238,211,223,0.8);

      border-radius: 17px;

      background:
        rgba(255,249,252,0.8);

      text-align: left;
    }


    .history-item:last-child {
      margin-bottom: 0;
    }


    .history-message {
      font-size: 14px;

      line-height: 1.55;

      white-space: pre-wrap;

      word-break: break-word;
    }


    .history-photo {
      width: 100%;

      max-height: 260px;

      object-fit: cover;

      margin-top: 9px;

      border-radius: 14px;
    }


    .history-date {
      margin-top: 8px;

      font-size: 10px;

      color: #aaa;
    }


    .history-viewed {
      margin-top: 5px;

      font-size: 10px;

      color: #999;
    }


    .history-reaction {
      margin-top: 5px;

      font-size: 12px;
    }


    .empty-history {
      padding: 18px 8px;

      text-align: center;

      font-size: 12px;

      color: #aaa;
    }


    @media (max-height: 760px) {

      body {
        padding-top: 12px;
      }


      .title {
        margin-bottom: 8px;

        font-size: 22px;
      }


      .card {
        padding:
          15px 14px;

        margin-bottom: 8px;
      }


      .card-title {
        margin-bottom: 9px;

        font-size: 17px;
      }


      #receivedMessage {
        padding:
          10px 8px;

        font-size: 16px;
      }


      .reaction-button {
        width: 39px;
        height: 39px;

        font-size: 19px;
      }


      textarea {
        min-height: 66px;
      }


      #sendButton {
        margin-top: 10px;
      }

    }

  </style>
</head>


<body>

<div class="shooting-star"></div>


<div class="page">

  <div class="title">
    for you
  </div>


  <!-- 受け取る -->

  <div class="card">

    <div class="card-title">
      受け取る 💌
    </div>
