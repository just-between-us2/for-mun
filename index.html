<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>for you</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      padding:
        28px 20px
        60px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;

      color: #3d3440;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255,255,255,0.8),
          transparent 24%
        ),
        radial-gradient(
          circle at 85% 12%,
          rgba(255,220,238,0.8),
          transparent 28%
        ),
        linear-gradient(
          165deg,
          #fff7fb 0%,
          #fce7f1 38%,
          #f6d8ea 68%,
          #eadcf7 100%
        );

      overflow-x: hidden;
    }


    /* -------------------------
       星空
    -------------------------- */

    body::before {
      content: "✦";

      position: fixed;
      top: 8%;
      left: 8%;

      color:
        rgba(175,145,220,0.45);

      font-size: 14px;

      pointer-events: none;

      z-index: 0;

      text-shadow:

        56px 90px 0
        rgba(255,255,255,0.8),

        130px 28px 0
        rgba(181,150,225,0.45),

        220px 110px 0
        rgba(255,255,255,0.75),

        300px 35px 0
        rgba(190,155,225,0.5),

        32px 245px 0
        rgba(255,255,255,0.8),

        145px 330px 0
        rgba(185,150,225,0.42),

        285px 270px 0
        rgba(255,255,255,0.8),

        75px 500px 0
        rgba(185,150,225,0.4),

        230px 580px 0
        rgba(255,255,255,0.8),

        320px 700px 0
        rgba(180,145,220,0.45),

        30px 820px 0
        rgba(255,255,255,0.75),

        190px 920px 0
        rgba(180,145,220,0.4);
    }


    body::after {
      content: "☾";

      position: fixed;

      top: 8%;
      right: 8%;

      color:
        rgba(255,255,255,0.85);

      font-size: 48px;

      text-shadow:
        0 0 18px
        rgba(255,255,255,0.7);

      pointer-events: none;

      z-index: 0;
    }


    .shooting-star {
      position: fixed;

      top: 18%;
      left: 14%;

      width: 72px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(177,145,220,0.6)
        );

      transform:
        rotate(-26deg);

      border-radius: 999px;

      z-index: 0;

      pointer-events: none;
    }


    .shooting-star::after {
      content: "✦";

      position: absolute;

      right: -2px;
      top: -8px;

      font-size: 13px;

      color:
        rgba(177,145,220,0.7);
    }


    .page {
      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 460px;

      margin: 0 auto;
    }


    .title {
      margin:
        18px 0
        24px;

      text-align: center;

      font-size: 26px;

      font-weight: 600;

      letter-spacing: 0.03em;
    }


    .subtitle {
      margin-top: -14px;
      margin-bottom: 28px;

      text-align: center;

      font-size: 12px;

      color:
        rgba(90,70,95,0.5);
    }


    /* -------------------------
       共通カード
    -------------------------- */

    .card {
      width: 100%;

      margin-bottom: 22px;

      padding:
        30px 22px;

      border:
        1px solid
        rgba(255,255,255,0.75);

      border-radius: 30px;

      background:
        rgba(255,255,255,0.78);

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

      box-shadow:
        0 15px 45px
        rgba(178,105,145,0.14);
    }


    .card-title {
      margin-bottom: 7px;

      text-align: center;

      font-size: 22px;

      font-weight: 700;
    }


    .card-subtitle {
      margin-bottom: 24px;

      text-align: center;

      font-size: 12px;

      color: #aaa;
    }


    /* -------------------------
       受け取る
    -------------------------- */

    #receivedMessage {
      padding:
        20px 16px;

      border:
        1px solid
        rgba(234,182,200,0.5);

      border-radius: 22px;

      background:
        rgba(255,246,250,0.8);

      font-size: 20px;

      line-height: 1.8;

      text-align: center;

      white-space: pre-wrap;

      word-break: break-word;
    }


    .loading {
      font-size: 15px !important;

      color: #aaa;
    }


    #receivedPhotoArea {
      display: none;

      margin-top: 20px;
    }


    #receivedPhoto {
      width: 100%;

      max-height: 420px;

      object-fit: cover;

      border-radius: 22px;

      box-shadow:
        0 8px 25px
        rgba(150,100,120,0.13);
    }


    #receivedDate {
      margin-top: 15px;

      text-align: center;

      font-size: 12px;

      color: #aaa;
    }


    /* -------------------------
       リアクション
    -------------------------- */

    #reactionArea {
      display: none;

      margin-top: 24px;

      padding-top: 20px;

      border-top:
        1px solid
        rgba(235,210,220,0.8);
    }


    .reaction-title {
      margin-bottom: 13px;

      text-align: center;

      font-size: 12px;

      color: #aaa;
    }


    .reaction-buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    .reaction-button {
      width: 54px;
      height: 54px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,239,246,0.95);

      font-size: 24px;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s,
        box-shadow 0.15s;
    }


    .reaction-button:active {
      transform: scale(0.9);
    }


    .reaction-button.selected {
      background: #f7cfdf;

      transform:
        scale(1.08);

      box-shadow:
        0 0 18px
        rgba(231,155,187,0.35);
    }


    #reactionStatus {
      min-height: 18px;

      margin-top: 11px;

      text-align: center;

      font-size: 12px;

      color: #aaa;
    }


    /* -------------------------
       区切り
    -------------------------- */

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin:
        8px 4px
        22px;

      color:
        rgba(155,110,145,0.7);

      font-size: 11px;

      white-space: nowrap;
    }


    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      flex: 1;

      background:
        rgba(200,160,185,0.35);
    }


    /* -------------------------
       送信
    -------------------------- */

    textarea {
      width: 100%;

      min-height: 135px;

      padding: 17px;

      border:
        1px solid
        #efd4df;

      border-radius: 22px;

      resize: vertical;

      outline: none;

      background:
        rgba(255,249,252,0.9);

      font-size: 16px;

      line-height: 1.7;

      font-family: inherit;

      color: #3d3440;
    }


    textarea:focus {
      border-color:
        #e6acc3;

      box-shadow:
        0 0 0 3px
        rgba(235,180,202,0.12);
    }


    .photo-area {
      margin-top: 20px;

      text-align: center;
    }


    .file-label {
      display: inline-block;

      padding:
        12px 20px;

      border-radius: 999px;

      background:
        rgba(255,233,243,0.95);

      cursor: pointer;

      font-size: 15px;
    }


    #photoInput {
      display: none;
    }


    #previewTitle {
      display: none;

      margin-top: 17px;

      font-size: 12px;

      color: #aaa;
    }


    #preview {
      display: none;

      width: 100%;

      max-height: 370px;

      object-fit: cover;

      margin-top: 10px;

      border-radius: 20px;
    }


    #sendButton {
      width: 100%;

      margin-top: 22px;

      padding: 16px;

      border: none;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          #e7a6bf,
          #edaac7,
          #e5b4da
        );

      box-shadow:
        0 9px 24px
        rgba(218,135,174,0.25);

      color: white;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;
    }


    #sendButton:disabled {
      opacity: 0.5;
    }


    #status {
      min-height: 20px;

      margin-top: 13px;

      text-align: center;

      font-size: 13px;

      color: #999;
    }


    /* -------------------------
       スクロール案内
    -------------------------- */

    .scroll-guide {
      margin:
        6px 0
        22px;

      text-align: center;

      font-size: 12px;

      color:
        rgba(130,90,120,0.65);
    }


    .scroll-arrow {
      display: block;

      margin-top: 6px;

      font-size: 22px;
    }


    /* -------------------------
       履歴
    -------------------------- */

    .history-card {
      padding:
        26px 18px;
    }


    .history-heading {
      margin-bottom: 5px;

      text-align: center;

      font-size: 19px;

      font-weight: 700;
    }


    .history-subheading {
      margin-bottom: 20px;

      text-align: center;

      font-size: 12px;

      color: #aaa;
    }


    .history-item {
      margin-bottom: 13px;

      padding:
        16px;

      border:
        1px solid
        rgba(238,211,223,0.8);

      border-radius: 20px;

      background:
        rgba(255,249,252,0.8);

      text-align: left;
    }


    .history-item:last-child {
      margin-bottom: 0;
    }


    .history-message {
      font-size: 15px;

      line-height: 1.7;

      white-space: pre-wrap;

      word-break: break-word;
    }


    .history-photo {
      width: 100%;

      max-height: 280px;

      object-fit: cover;

      margin-top: 11px;

      border-radius: 16px;
    }


    .history-date {
      margin-top: 10px;

      font-size: 11px;

      color: #aaa;
    }


    .history-viewed {
      margin-top: 7px;

      font-size: 11px;

      color: #999;
    }


    .history-reaction {
      margin-top: 7px;

      font-size: 13px;
    }


    .empty-history {
      padding: 22px 10px;

      text-align: center;

      font-size: 13px;

      color: #aaa;
    }

  </style>
</head>


<body>

<div class="shooting-star"></div>


<div class="page">

  <div class="title">
    for you
  </div>

  <div class="subtitle">
    いつでも つながってるよ
  </div>


  <!-- =========================
       受け取る
  ========================== -->

  <div class="card">

    <div class="card-title">
      受け取る 💌
    </div>

    <div class="card-subtitle">
      最新で届いたメッセージ
    </div>


    <div
      id="receivedMessage"
      class="loading"
    >
      メッセージを読み込んでいます…
    </div>


    <div id="receivedPhotoArea">

      <img
        id="receivedPhoto"
        alt="received photo"
      >

    </div>


    <div id="reactionArea">

      <div class="reaction-title">
        気持ちを返す
      </div>


      <div class="reaction-buttons">

        <button
          class="reaction-button"
          data-reaction="🫶"
        >
          🫶
        </button>


        <button
          class="reaction-button"
          data-reaction="🤟"
        >
          🤟
        </button>


        <button
          class="reaction-button"
          data-reaction="🦄"
        >
          🦄
        </button>


        <button
          class="reaction-button"
          data-reaction="🧸"
        >
          🧸
        </button>

      </div>


      <div id="reactionStatus"></div>

    </div>


    <div id="receivedDate"></div>

  </div>


  <div class="divider">
    ✦ ふたりの星空 ✦
  </div>


  <!-- =========================
       届ける
  ========================== -->

  <div class="card">

    <div class="card-title">
      届ける 💌
    </div>

    <div class="card-subtitle">
      メッセージや写真を送ってみよう
    </div>


    <textarea
      id="messageInput"
      placeholder="メッセージを書く…"
    ></textarea>


    <div class="photo-area">

      <label
        class="file-label"
        for="photoInput"
      >
        📷 写真を選ぶ
      </label>


      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >


      <div id="previewTitle">
        今回届ける写真
      </div>


      <img
        id="preview"
        alt="preview"
      >

    </div>


    <button id="sendButton">
      届ける 💌
    </button>


    <div id="status"></div>

  </div>


  <div class="scroll-guide">
    下にスライドすると過去の履歴が見れる
    <span class="scroll-arrow">
      ⌄
    </span>
  </div>


  <!-- =========================
       履歴
  ========================== -->

  <div class="card history-card">

    <div class="history-heading">
      これまで届けたもの
    </div>

    <div class="history-subheading">
      あなたから届けたメッセージ
    </div>


    <div id="historyList">
      読み込んでいます…
    </div>

  </div>

</div>


<script>


/* =========================
   Supabase
========================= */

const PROJECT_URL =
  "https://pwuhcajvuwoumgzcrzcu.supabase.co";


const REST_URL =
  PROJECT_URL +
  "/rest/v1";


const STORAGE_URL =
  PROJECT_URL +
  "/storage/v1";


const SUPABASE_KEY =
  "sb_publishable_xKz256OVExfMdxs0qajatw_LUtHDFSd";


const BUCKET =
  "photos";


/*
  彼女用ページ

  相手 = すぱだり
  自分 = 彼女
*/

const RECEIVED_FROM =
  "me";


const SEND_AS =
  "her";


let currentReceivedPostId =
  null;


/* =========================
   要素
========================= */

const receivedMessage =
  document.getElementById(
    "receivedMessage"
  );


const receivedPhotoArea =
  document.getElementById(
    "receivedPhotoArea"
  );


const receivedPhoto =
  document.getElementById(
    "receivedPhoto"
  );


const receivedDate =
  document.getElementById(
    "receivedDate"
  );


const reactionArea =
  document.getElementById(
    "reactionArea"
  );


const reactionStatus =
  document.getElementById(
    "reactionStatus"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const photoInput =
  document.getElementById(
    "photoInput"
  );


const preview =
  document.getElementById(
    "preview"
  );


const previewTitle =
  document.getElementById(
    "previewTitle"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const status =
  document.getElementById(
    "status"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


/* =========================
   最新の受信
========================= */

async function loadLatestReceived() {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?select=id,message,photo_url,created_at,viewed_at,reaction,sender" +

        "&sender=eq." +
        encodeURIComponent(
          RECEIVED_FROM
        ) +

        "&order=id.desc" +

        "&limit=1",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


    const data =
      await response.json();


    receivedMessage
      .classList
      .remove(
        "loading"
      );


    if (data.length === 0) {

      currentReceivedPostId =
        null;


      receivedMessage.textContent =
        "まだ届いていません 💭";


      receivedPhotoArea.style.display =
        "none";


      reactionArea.style.display =
        "none";


      receivedDate.textContent =
        "";


      return;

    }


    const post =
      data[0];


    currentReceivedPostId =
      post.id;


    receivedMessage.textContent =
      post.message ||
      "";


    /* 写真 */

    if (post.photo_url) {

      receivedPhoto.src =
        post.photo_url;


      receivedPhotoArea.style.display =
        "block";

    } else {

      receivedPhoto
        .removeAttribute(
          "src"
        );


      receivedPhotoArea.style.display =
        "none";

    }


    /* リアクション */

    reactionArea.style.display =
      "block";


    updateReactionButtons(
      post.reaction
    );


    /* 日時 */

    const date =
      new Date(
        post.created_at
      );


    receivedDate.textContent =
      date.toLocaleString(
        "ja-JP",
        {
          year:
            "numeric",

          month:
            "long",

          day:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"
        }
      );


    /* 初回だけ既読 */

    if (!post.viewed_at) {

      await markAsViewed(
        post.id
      );

    }


  } catch (error) {

    console.error(
      error
    );


    receivedMessage
      .classList
      .remove(
        "loading"
      );


    receivedMessage.textContent =
      "読み込めませんでした 🥲";

  }

}


/* =========================
   既読
========================= */

async function markAsViewed(
  postId
) {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?id=eq." +
        postId +

        "&viewed_at=is.null",

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              {

                viewed_at:
                  new Date()
                    .toISOString()

              }
            )

        }

      );


    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


  } catch (error) {

    console.error(
      "既読保存エラー",
      error
    );

  }

}


/* =========================
   リアクション
========================= */

async function saveReaction(
  reaction
) {

  if (!currentReceivedPostId) {

    return;

  }


  reactionStatus.textContent =
    "届けています…";


  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?id=eq." +
        currentReceivedPostId,

        {

          method:
            "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              {

                reaction:
                  reaction

              }
            )

        }

      );


    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


    updateReactionButtons(
      reaction
    );


    reactionStatus.textContent =
      "届きました ♡";


    setTimeout(
      function() {

        reactionStatus.textContent =
          "";

      },
      1500
    );


  } catch (error) {

    console.error(
      error
    );


    reactionStatus.textContent =
      "送れませんでした 🥲";

  }

}


/* =========================
   リアクション選択表示
========================= */

function updateReactionButtons(
  reaction
) {

  document
    .querySelectorAll(
      ".reaction-button"
    )
    .forEach(
      function(button) {

        if (
          button.dataset.reaction ===
          reaction
        ) {

          button
            .classList
            .add(
              "selected"
            );

        } else {

          button
            .classList
            .remove(
              "selected"
            );

        }

      }
    );

}


/* =========================
   リアクション操作
========================= */

document
  .querySelectorAll(
    ".reaction-button"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          saveReaction(
            button.dataset.reaction
          );

        }
      );

    }
  );


/* =========================
   写真プレビュー
========================= */

photoInput.addEventListener(
  "change",
  function() {

    const file =
      photoInput.files[0];


    if (!file) {

      preview.style.display =
        "none";


      previewTitle.style.display =
        "none";


      preview
        .removeAttribute(
          "src"
        );


      return;

    }


    preview.src =
      URL.createObjectURL(
        file
      );


    preview.style.display =
      "block";


    previewTitle.style.display =
      "block";

  }
);


/* =========================
   届ける
========================= */

sendButton.addEventListener(
  "click",
  async function() {

    const message =
      messageInput
        .value
        .trim();


    const file =
      photoInput.files[0];


    if (!message && !file) {

      status.textContent =
        "メッセージか写真を選んでね 💭";


      return;

    }


    sendButton.disabled =
      true;


    status.textContent =
      "届けています… 💌";


    let photoUrl =
      null;


    try {


      /* ----------------
         写真アップロード
      ---------------- */

      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
            : "jpg";


        const fileName =
          SEND_AS +
          "_" +
          Date.now() +
          "." +
          extension;


        const photoResponse =
          await fetch(

            STORAGE_URL +

            "/object/" +

            BUCKET +

            "/" +

            fileName,

            {

              method:
                "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Content-Type":
                  file.type ||
                  "image/jpeg",

                "x-upsert":
                  "false"

              },

              body:
                file

            }

          );


        if (!photoResponse.ok) {

          const errorText =
            await photoResponse.text();


          throw new Error(
            "写真送信失敗: " +
            errorText
          );

        }


        photoUrl =
          STORAGE_URL +

          "/object/public/" +

          BUCKET +

          "/" +

          encodeURIComponent(
            fileName
          );

      }


      /* ----------------
         投稿保存
      ---------------- */

      const messageResponse =
        await fetch(

          REST_URL +
          "/messages",

          {

            method:
              "POST",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(
                {

                  message:
                    message ||
                    "",

                  photo_url:
                    photoUrl,

                  viewed_at:
                    null,

                  reaction:
                    null,

                  sender:
                    SEND_AS

                }
              )

          }

        );


      if (!messageResponse.ok) {

        const errorText =
          await messageResponse.text();


        throw new Error(
          "メッセージ送信失敗: " +
          errorText
        );

      }


      status.textContent =
        "届きました 💌♡";


      messageInput.value =
        "";


      photoInput.value =
        "";


      preview.style.display =
        "none";


      previewTitle.style.display =
        "none";


      preview
        .removeAttribute(
          "src"
        );


      await loadHistory();


      setTimeout(
        function() {

          status.textContent =
            "";

        },
        2000
      );


    } catch (error) {

      console.error(
        error
      );


      status.textContent =
        "エラー：" +
        error.message;

    } finally {

      sendButton.disabled =
        false;

    }

  }
);


/* =========================
   自分が送った履歴
========================= */

async function loadHistory() {

  try {

    const response =
      await fetch(

        REST_URL +

        "/messages" +

        "?select=id,message,photo_url,created_at,viewed_at,reaction,sender" +

        "&sender=eq." +
        encodeURIComponent(
          SEND_AS
        ) +

        "&order=id.desc" +

        "&limit=50",

        {

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }

      );


    if (!response.ok) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


    const posts =
      await response.json();


    historyList.innerHTML =
      "";


    if (posts.length === 0) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "empty-history";


      empty.textContent =
        "まだ届けたものはありません 💭";


      historyList.appendChild(
        empty
      );


      return;

    }


    posts.forEach(
      function(post) {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "history-item";


        /* メッセージ */

        if (post.message) {

          const message =
            document.createElement(
              "div"
            );


          message.className =
            "history-message";


          message.textContent =
            post.message;


          item.appendChild(
            message
          );

        }


        /* 写真 */

        if (post.photo_url) {

          const img =
            document.createElement(
              "img"
            );


          img.className =
            "history-photo";


          img.src =
            post.photo_url;


          img.alt =
            "history photo";


          item.appendChild(
            img
          );

        }


        /* 送信時間 */

        const date =
          new Date(
            post.created_at
          );


        const dateText =
          document.createElement(
            "div"
          );


        dateText.className =
          "history-date";


        dateText.textContent =
          "送信：" +
          date.toLocaleString(
            "ja-JP",
            {

              year:
                "numeric",

              month:
                "long",

              day:
                "numeric",

              hour:
                "2-digit",

              minute:
                "2-digit"

            }
          );


        item.appendChild(
          dateText
        );


        /* 既読 */

        const viewed =
          document.createElement(
            "div"
          );


        viewed.className =
          "history-viewed";


        if (post.viewed_at) {

          const viewedDate =
            new Date(
              post.viewed_at
            );


          viewed.textContent =
            "見てくれた ✓ " +
            viewedDate.toLocaleString(
              "ja-JP",
              {

                month:
                  "long",

                day:
                  "numeric",

                hour:
                  "2-digit",

                minute:
                  "2-digit"

              }
            );

        } else {

          viewed.textContent =
            "まだ見ていません";

        }


        item.appendChild(
          viewed
        );


        /* リアクション */

        const reaction =
          document.createElement(
            "div"
          );


        reaction.className =
          "history-reaction";


        if (post.reaction) {

          reaction.textContent =
            "リアクション：" +
            post.reaction;

        } else {

          reaction.textContent =
            "リアクションはまだありません";

        }


        item.appendChild(
          reaction
        );


        historyList.appendChild(
          item
        );

      }
    );


  } catch (error) {

    console.error(
      error
    );


    historyList.textContent =
      "履歴を読み込めませんでした 🥲";

  }

}


/* =========================
   最初に読み込む
========================= */

loadLatestReceived();
loadHistory();


/* =========================
   5秒ごとに更新
========================= */

setInterval(
  function() {

    loadLatestReceived();
    loadHistory();

  },
  5000
);


</script>
